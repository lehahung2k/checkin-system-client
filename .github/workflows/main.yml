name: Build and Deploy React App

on:
  push:
    branches: 
      - develop
      - 'feat/*'
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      deploy_type:
        description: 'Deploy code?'
        required: true
        type: choice
        options:
          - 'yes'
          - 'no'
        default: 'no'

env:
  DOCKER_IMAGE: lehahung20/checkin-system-client
  CONTAINER_NAME: checkin-system-client

jobs:
  build-code:
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/develop' || 
      github.head_ref == 'develop' || 
      github.event.pull_request.base.ref == 'develop' ||
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Setup npm cache
        uses: actions/cache@v2
        with:
          path: ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-

      - name: Build React app
        run: |
          echo "PORT=${{ secrets.PORT }}" >> .env
          echo "REACT_APP_BASE_URL=${{ secrets.REACT_APP_BASE_URL }}" >> .env
          echo "REACT_APP_ACCESS_TOKEN_SECRET_KEY=${{ secrets.REACT_APP_ACCESS_TOKEN_SECRET_KEY }}" >> .env
          CI=false npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: react-build
          path: ./build

  build-and-push-docker:
    needs: build-code
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_type == 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: react-build
          path: ./build

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

  deploy-production:
    needs: build-and-push-docker
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_type == 'yes'

    uses: ./.github/workflows/ssh-deploy.yml
    with:
      image_name: lehahung20/checkin-system-client
      image_tag: ${{ github.sha }}
      container_name: checkin-system-client
      host: ubuntu.pro.server
      port: "80"
    secrets:
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      SSH_CONFIG: ${{ secrets.SSH_CONFIG }}
